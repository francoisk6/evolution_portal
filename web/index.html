<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="evolution_portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>evolution_portal</title>
  <link rel="manifest" href="manifest.json">

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    });
  }
  </script>  

  <script>
  (function () {
    const CLEANUP_VERSION = '2026-04-10-export-icon-fix-1';
    const KEY = 'evo_cache_cleanup_version';

    if (localStorage.getItem(KEY) === CLEANUP_VERSION) {
      return;
    }

    async function cleanupAndReload() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }

        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
      } catch (e) {
        console.warn('Cache cleanup failed:', e);
      } finally {
        localStorage.setItem(KEY, CLEANUP_VERSION);

        // Reload without adding a query param — a param-modified URL persists
        // in the browser address bar and GoRouter treats it as an unmatched route.
        const url = new URL(window.location.href);
        url.search = '';
        window.location.replace(url.toString());
      }
    }

    window.addEventListener('load', function () {
      cleanupAndReload();
    }, { once: true });
  })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
