name: evolution_portal
publish_to: 'none'
description: Evolution Portal
version: 1.2.16+34

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.0.7
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  printing: ^5.13.0
  pdf: ^3.11.0
  flutter_native_contact_picker: ^0.0.12
  flutter_inappwebview: ^6.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/backgrounds/tech_bg_3.jpg

flutter_launcher_icons:
  android: true
  image_path_android: "assets/launcher_icon.png"
  adaptive_icon_foreground: "assets/launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"